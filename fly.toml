app = "giftnice-bot" # Bu yerga o'zingiz xohlagan noyob nom yozing (agar band bo'lsa o'zgartirasiz)
primary_region = "fra" # Frankfurt (Evropa) - O'zbekistonga eng yaqin va tez hududlardan biri

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
